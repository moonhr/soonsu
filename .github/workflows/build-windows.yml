name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Python
        shell: pwsh
        run: |
          python --version
          python -c "import sys; print(sys.executable)"
          pip --version

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Download yt-dlp.exe & ffmpeg.exe
        shell: pwsh
        run: |
          curl -L -o yt-dlp.exe https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe
          curl -L -o ffmpeg.zip https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip
          tar -xf ffmpeg.zip -C . --strip-components=2 */bin/ffmpeg.exe

      - name: Build EXE
        shell: pwsh
        run: |
          python -m PyInstaller --onefile --windowed --name SoonsuDownloader `
            --add-binary "yt-dlp.exe;." `
            --add-binary "ffmpeg.exe;." `
            ytdlp_from_csv.py

      - name: Zip artifact
        run: powershell Compress-Archive -Path dist/SoonsuDownloader.exe -DestinationPath dist/SoonsuDownloader-win.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SoonsuDownloader-win.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
